<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$title$ — Blip · Comitê de Product Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --blip-orange: #F97316; --blip-night: #1A1040; --blip-peach: #FED7AA;
      --blip-gold: #FBBF24; --blip-mint: #10B981; --blip-violet: #A78BFA;
      --blip-offwhite: #F8F7FF;
    }
    * { box-sizing: border-box; }
    body { font-family: 'Fredoka', sans-serif; background: var(--blip-offwhite);
           color: var(--blip-night); line-height: 1.7; margin: 0; }
    /* Prose */
    .prose h1 { font-size: 2rem; font-weight: 700; color: var(--blip-night);
                margin: 0 0 8px; line-height: 1.2; padding-bottom: 12px;
                border-bottom: 3px solid var(--blip-orange); }
    .prose h2 { font-size: 1.4rem; font-weight: 600; color: var(--blip-night);
                margin: 2rem 0 0.75rem; border-left: 4px solid var(--blip-orange);
                padding-left: 12px; }
    .prose h3 { font-size: 1.15rem; font-weight: 600; color: #4c1d95;
                margin: 1.5rem 0 0.5rem; }
    .prose h4 { font-size: 0.85rem; font-weight: 700; color: var(--blip-orange);
                margin: 1.25rem 0 0.5rem; letter-spacing: 1px; text-transform: uppercase; }
    .prose p  { margin-bottom: 1rem; font-size: 1rem; }
    .prose ul, .prose ol { margin: 0.75rem 0 1rem 1.5rem; }
    .prose li { margin-bottom: 0.4rem; }
    .prose strong { font-weight: 700; }
    .prose em { color: var(--blip-violet); }
    .prose code { background: var(--blip-night); color: var(--blip-peach);
                  padding: 2px 7px; border-radius: 4px; font-size: 0.88rem; }
    .prose pre  { background: var(--blip-night); color: #e2e8f0; padding: 20px;
                  border-radius: 12px; overflow-x: auto; margin: 1.5rem 0; }
    .prose pre code { background: none; color: inherit; padding: 0; }
    .prose table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; font-size: 0.95rem; }
    .prose th    { background: var(--blip-night); color: #fff; padding: 10px 14px;
                   text-align: left; font-weight: 600; }
    .prose td    { padding: 10px 14px; border-bottom: 1px solid var(--blip-peach); }
    .prose tr:nth-child(even) td { background: rgba(254,215,170,0.2); }
    .prose blockquote { border-left: 4px solid var(--blip-orange);
                        background: rgba(249,115,22,0.06); padding: 12px 20px;
                        border-radius: 0 8px 8px 0; margin: 1.5rem 0; }
    .prose hr { border: none; border-top: 2px solid var(--blip-peach); margin: 2rem 0; }
    /* Barra de progresso de leitura */
    #progress { position: fixed; top: 0; left: 0; height: 3px; width: 0%;
                background: linear-gradient(90deg, var(--blip-orange), var(--blip-gold));
                z-index: 9999; transition: width 0.1s; }
  </style>
</head>
<body>

<div id="progress"></div>

<!-- NAV -->
<nav style="background:#1A1040; position:sticky; top:0; z-index:100;
     box-shadow:0 2px 20px rgba(0,0,0,0.4); padding:0 24px;">
  <div style="max-width:860px; margin:0 auto; display:flex; align-items:center;
       justify-content:space-between; height:56px; gap:16px;">
    <div style="display:flex; align-items:center; gap:12px; min-width:0;">
      <span style="font-family:'Fredoka',sans-serif; font-weight:700; font-size:20px;
            color:#fff; white-space:nowrap;">🎯 Blip</span>
      <span style="color:rgba(255,255,255,0.25);">›</span>
      <span style="font-family:'Fredoka',sans-serif; font-size:14px; font-weight:600;
            color:rgba(255,255,255,0.7); white-space:nowrap; overflow:hidden;
            text-overflow:ellipsis;">$title$</span>
    </div>
    <a href="./index.html"
       style="flex-shrink:0; background:rgba(249,115,22,0.15);
              border:1px solid rgba(249,115,22,0.45); color:#FED7AA;
              font-family:'Fredoka',sans-serif; font-weight:600; font-size:13px;
              padding:8px 18px; border-radius:20px; text-decoration:none;
              white-space:nowrap;">
      ← Microsite
    </a>
  </div>
</nav>

<!-- CONTEÚDO -->
<main style="max-width:860px; margin:0 auto; padding:48px 24px 96px;">
  <div class="prose">
    $body$
  </div>
</main>

<!-- FOOTER -->
<footer style="background:#1A1040; padding:28px 24px; text-align:center;">
  <p style="font-family:'Fredoka',sans-serif; font-size:13px;
     color:rgba(255,255,255,0.35); font-weight:600; letter-spacing:0.3px;">
    Blip · Material confidencial · Comitê de Product Design · Abril 2026
  </p>
</footer>

<script>
  window.addEventListener('scroll', () => {
    const docEl = document.documentElement;
    const scrolled = docEl.scrollTop / (docEl.scrollHeight - docEl.clientHeight);
    document.getElementById('progress').style.width = (scrolled * 100) + '%';
  }, { passive: true });
</script>
</body>
</html>
